[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ffmpeg-parallel-v3"
version = "0.1.0"
description = "Distributed video encoding — PC Hub + Android/Termux spoke workers"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["termux_spoke*", "pc_hub*"]